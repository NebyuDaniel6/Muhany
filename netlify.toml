[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"

# Handle SPA routing - but exclude existing static files
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
conditions = {Role = ["admin"]}

# Handle presentation route specifically
[[redirects]]
from = "/presentation"
to = "/presentation/index.html"
status = 200

# Redirect www to non-www (optional)
[[redirects]]
from = "https://www.muhanychocos.shop/*"
to = "https://muhanychocos.shop/:splat"
status = 301

# Handle subdomain redirects if needed
[[redirects]]
from = "https://lander.muhanychocos.shop/*"
to = "https://muhanychocos.shop/:splat"
status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin" 